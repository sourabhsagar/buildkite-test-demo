env:
  # Test Engine API Token (Buildkite Examples org)
  BUILDKITE_ANALYTICS_TOKEN: "Ebk93SVKKoR8LUgQ97q5KvWC"

steps:
  - label: ":jest: Run All Tests with Test Engine"
    command: |
      echo "--- :package: Installing dependencies"
      npm install

      echo "--- :buildkite: Checking Test Engine environment"
      echo "BUILDKITE_ANALYTICS_TOKEN is set: $${BUILDKITE_ANALYTICS_TOKEN:+YES}"
      echo "CI environment: $$CI"

      echo "--- :jest: Running all tests with Test Engine tracking"
      npm test

      echo "--- :bar_chart: JUnit XML generated at test-results/junit.xml"
      ls -lh test-results/

    # Allow the build to continue even if tests fail
    soft_fail: true

    # Upload JUnit XML as artifact
    artifact_paths:
      - "test-results/junit.xml"

  - label: ":white_check_mark: Run Only Passing Tests"
    command: |
      npm install
      npm test passing.test.js

  - label: ":x: Run Only Failing Tests"
    command: |
      npm install
      npm test failing.test.js || echo "Tests failed as expected!"
    soft_fail: true

  - label: ":game_die: Run Only Flaky Tests"
    command: |
      npm install
      npm test flaky.test.js || echo "Some tests may have failed (flaky!)"
    soft_fail: true
